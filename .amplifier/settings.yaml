# Amplifier IPC project settings.
#
# The old stdio/subprocess service_overrides are no longer used.
# Services now run as Dapr-native containers via docker-compose.
# To start the full stack:
#
#   docker compose up
#
# For local development of individual services, you can run them
# directly with uv and override the Dapr endpoint:
#
#   cd services/svc-machine
#   uv run uvicorn svc_machine.main:app --port 8001
