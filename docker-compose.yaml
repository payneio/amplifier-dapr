version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  svc-machine:
    build:
      context: .
      dockerfile: services/svc-machine/Dockerfile
    environment:
      WORKSPACE_DIR: /workspace
    volumes:
      - ${WORKSPACE_PATH:-.}:/workspace
    depends_on:
      - redis

  svc-machine-dapr:
    image: daprio/daprd:1.14.4
    command:
      - ./daprd
      - --app-id=svc-machine
      - --app-port=8000
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --resources-path=/components
      - --config=/config/config.yaml
    volumes:
      - ./docker/dapr/components:/components
      - ./docker/dapr:/config
    network_mode: "service:svc-machine"
    depends_on:
      - svc-machine

  svc-bash:
    build:
      context: .
      dockerfile: services/svc-bash/Dockerfile
    environment:
      DAPR_HTTP_PORT: "3500"
    depends_on:
      - redis
      - svc-machine-dapr

  svc-bash-dapr:
    image: daprio/daprd:1.14.4
    command:
      - ./daprd
      - --app-id=svc-bash
      - --app-port=8000
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --resources-path=/components
      - --config=/config/config.yaml
    volumes:
      - ./docker/dapr/components:/components
      - ./docker/dapr:/config
    network_mode: "service:svc-bash"
    depends_on:
      - svc-bash
