services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  svc-machine:
    build:
      context: .
      dockerfile: services/svc-machine/Dockerfile
    environment:
      WORKSPACE_DIR: /workspace
    volumes:
      - ${WORKSPACE_PATH:-.}:/workspace
    depends_on:
      - redis

  svc-machine-dapr:
    image: daprio/daprd:1.14.4
    command:
      - ./daprd
      - --app-id=svc-machine
      - --app-port=8000
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --resources-path=/components
      - --config=/config/config.yaml
    volumes:
      - ./docker/dapr/components:/components
      - ./docker/dapr:/config
    network_mode: "service:svc-machine"
    depends_on:
      - svc-machine

  svc-bash:
    build:
      context: .
      dockerfile: services/svc-bash/Dockerfile
    environment:
      DAPR_HTTP_PORT: "3500"
    depends_on:
      - redis
      - svc-machine-dapr

  svc-bash-dapr:
    image: daprio/daprd:1.14.4
    command:
      - ./daprd
      - --app-id=svc-bash
      - --app-port=8000
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --resources-path=/components
      - --config=/config/config.yaml
    volumes:
      - ./docker/dapr/components:/components
      - ./docker/dapr:/config
    network_mode: "service:svc-bash"
    depends_on:
      - svc-bash

  svc-context:
    build:
      context: .
      dockerfile: services/svc-context/Dockerfile
    environment:
      DAPR_HTTP_PORT: "3500"
    depends_on:
      - redis

  svc-context-dapr:
    image: daprio/daprd:1.14.4
    command:
      - ./daprd
      - --app-id=svc-context
      - --app-port=8000
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --resources-path=/components
      - --config=/config/config.yaml
    volumes:
      - ./docker/dapr/components:/components
      - ./docker/dapr:/config
    network_mode: "service:svc-context"
    depends_on:
      - svc-context

  svc-mock-provider:
    build:
      context: .
      dockerfile: services/svc-mock-provider/Dockerfile
    environment:
      DAPR_HTTP_PORT: "3500"
    depends_on:
      - redis

  svc-mock-provider-dapr:
    image: daprio/daprd:1.14.4
    command:
      - ./daprd
      - --app-id=svc-mock-provider
      - --app-port=8000
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --resources-path=/components
      - --config=/config/config.yaml
    volumes:
      - ./docker/dapr/components:/components
      - ./docker/dapr:/config
    network_mode: "service:svc-mock-provider"
    depends_on:
      - svc-mock-provider

  svc-orchestrator:
    build:
      context: .
      dockerfile: services/svc-orchestrator/Dockerfile
    environment:
      DAPR_HTTP_PORT: "3500"
    depends_on:
      - redis
      - svc-context-dapr
      - svc-mock-provider-dapr
      - svc-bash-dapr

  svc-orchestrator-dapr:
    image: daprio/daprd:1.14.4
    command:
      - ./daprd
      - --app-id=svc-orchestrator
      - --app-port=8000
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --resources-path=/components
      - --config=/config/config.yaml
    volumes:
      - ./docker/dapr/components:/components
      - ./docker/dapr:/config
    network_mode: "service:svc-orchestrator"
    depends_on:
      - svc-orchestrator

  session-service:
    build:
      context: .
      dockerfile: services/session-service/Dockerfile
    ports:
      - "8080:8000"
    environment:
      DAPR_HTTP_PORT: "3500"
    depends_on:
      - redis
      - svc-machine-dapr
      - svc-bash-dapr
      - svc-context-dapr
      - svc-mock-provider-dapr
      - svc-orchestrator-dapr

  session-service-dapr:
    image: daprio/daprd:1.14.4
    command:
      - ./daprd
      - --app-id=session-service
      - --app-port=8000
      - --dapr-http-port=3500
      - --dapr-grpc-port=50001
      - --resources-path=/components
      - --config=/config/config.yaml
    volumes:
      - ./docker/dapr/components:/components
      - ./docker/dapr:/config
    network_mode: "service:session-service"
    depends_on:
      - session-service
