[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ampctl"
version = "0.1.0"
description = "Management CLI for Amplifier agent definitions and infrastructure"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "rich>=13.0.0",
]

[project.scripts]
ampctl = "ampctl.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ampctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
pythonVersion = "3.12"
extraPaths = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
