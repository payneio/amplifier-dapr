agent:
  ref: foundation
  description: Full-featured agent with Anthropic provider and all capabilities
  instruction: |
    You are Amplifier, an AI-powered CLI tool that helps users accomplish tasks. You have access to tools for file operations, web search, code execution, and more. Focus on being helpful, accurate, and efficient.

  orchestrator:
    build: ./services/svc-orchestrator

  context_manager:
    build: ./services/svc-context

  providers:
    build: ./services/svc-providers
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY:-}"
      AZURE_OPENAI_ENDPOINT: "${AZURE_OPENAI_ENDPOINT:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"

  behaviors:
    machine:
      build: ./services/svc-machine
      environment:
        WORKSPACE_DIR: /workspace
      volumes:
        - "${WORKSPACE_PATH:-.}:/workspace"

    web:
      build: ./services/svc-web

    skills:
      build: ./services/svc-skills

    todo:
      build: ./services/svc-todo

    modes:
      build: ./services/svc-modes

    delegation:
      build: ./services/svc-delegation

    hooks-approval:
      build: ./services/svc-hooks-approval
      environment:
        DENY_TOOLS: ""

    hooks-routing:
      build: ./services/svc-hooks-routing
      environment:
        ROUTING_MATRIX_PATH: ""

    hooks-async:
      build: ./services/svc-hooks-async
      environment:
        LOG_TEMPLATE: "~/.amplifier/logs/{session_id}/events.jsonl"

    hooks-shell:
      build: ./services/svc-hooks-shell
      environment:
        SHELL_HOOKS_DIR: ""

    content-core:
      build: ./services/svc-content-core

    content-amplifier:
      build: ./services/svc-content-amplifier

    content-browser-tester:
      build: ./services/svc-content-browser-tester

    content-design-intelligence:
      build: ./services/svc-content-design-intelligence

    content-filesystem:
      build: ./services/svc-content-filesystem

    content-recipes:
      build: ./services/svc-content-recipes

    content-superpowers:
      build: ./services/svc-content-superpowers

    content-foundation:
      build: ./services/svc-content-foundation
