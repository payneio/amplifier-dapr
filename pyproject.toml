[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplifier-ipc"
version = "0.1.0"
requires-python = ">=3.11"
description = "Amplifier IPC - Dapr-native microservices framework for AI agent orchestration"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.0",
    "pyright>=1.1",
    "ruff>=0.1",
    "fastapi>=0.115",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
    "amplifier-service-sdk/src",
    "amplifier-cli/src",
    "ampctl/src",
    "services/svc-machine/src",
    "services/svc-bash/src",
    "services/svc-context/src",
    "services/svc-mock-provider/src",
    "services/svc-orchestrator/src",
    "services/session-service/src",
    "services/svc-filesystem/src",
    "services/svc-search/src",
    "services/svc-web/src",
    "services/svc-skills/src",
    "services/svc-todo/src",
    "services/svc-modes/src",
    "services/svc-providers/src",
    "services/svc-hooks-approval/src",
    "services/svc-hooks-routing/src",
    "services/svc-hooks-async/src",
    "services/svc-hooks-shell/src",
    "services/svc-delegation/src",
]
markers = [
    "slow: marks tests as slow-running (requires Docker Compose stack)",
]

[tool.pyright]
pythonVersion = "3.11"
extraPaths = [
    "amplifier-service-sdk/src",
    "amplifier-cli/src",
    "ampctl/src",
    "services/svc-machine/src",
    "services/svc-bash/src",
    "services/svc-context/src",
    "services/svc-mock-provider/src",
    "services/svc-orchestrator/src",
    "services/session-service/src",
    "services/svc-filesystem/src",
    "services/svc-search/src",
    "services/svc-web/src",
    "services/svc-skills/src",
    "services/svc-todo/src",
    "services/svc-modes/src",
    "services/svc-providers/src",
    "services/svc-hooks-approval/src",
    "services/svc-hooks-routing/src",
    "services/svc-hooks-async/src",
    "services/svc-hooks-shell/src",
    "services/svc-delegation/src",
]
