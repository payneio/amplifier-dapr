[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svc-web"
version = "0.1.0"
description = "Amplifier web tool service — search and fetch web content"
requires-python = ">=3.11"
dependencies = [
    "amplifier-service-sdk",
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "duckduckgo-search>=6.0",
]

[tool.uv.sources]
amplifier-service-sdk = { path = "../../amplifier-service-sdk" }

[tool.hatch.build.targets.wheel]
packages = ["src/svc_web"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
pythonVersion = "3.11"
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
