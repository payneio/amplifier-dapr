[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svc-machine"
version = "0.1.0"
description = "Amplifier machine service — subprocess execution and filesystem operations"
requires-python = ">=3.11"
dependencies = [
    "amplifier-service-sdk",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "asyncssh>=2.14",
]

[tool.uv.sources]
amplifier-service-sdk = { path = "../../amplifier-service-sdk" }

[tool.hatch.build.targets.wheel]
packages = ["src/svc_machine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
pythonVersion = "3.11"
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.28",
]
