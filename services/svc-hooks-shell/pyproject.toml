[project]
name = "svc-hooks-shell"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "amplifier-service-sdk",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[tool.uv.sources]
amplifier-service-sdk = { path = "../../amplifier-service-sdk" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svc_hooks_shell"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.28",
]
