[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svc-providers"
version = "0.1.0"
description = "Amplifier provider service — Anthropic, OpenAI, and Azure OpenAI"
requires-python = ">=3.11"
dependencies = [
    "amplifier-service-sdk",
    "anthropic>=0.40",
    "openai>=1.50",
]

[tool.uv.sources]
amplifier-service-sdk = { path = "../../amplifier-service-sdk" }

[tool.hatch.build.targets.wheel]
packages = ["src/svc_providers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
pythonVersion = "3.11"
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyright>=1.1",
    "ruff>=0.4",
]
