name: svc-bash
version: '0.1.0'
tools:
  - name: bash
    description: Execute shell commands on the machine service
    input_schema:
      type: object
      properties:
        command:
          type: string
          description: Shell command to execute
        timeout:
          type: integer
          default: 30  # must stay in sync with _DEFAULT_TIMEOUT_SECONDS in tool.py
          description: Command timeout in seconds
        run_in_background:
          type: boolean
          default: false
          description: Run the command in the background
      required:
        - command
