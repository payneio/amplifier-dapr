[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svc-context"
version = "0.1.0"
description = "Amplifier context management service — in-memory storage with progressive compaction"
requires-python = ">=3.11"
dependencies = [
    "amplifier-service-sdk",
]

[tool.uv.sources]
amplifier-service-sdk = { path = "../../amplifier-service-sdk" }

[tool.hatch.build.targets.wheel]
packages = ["src/svc_context"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
pythonVersion = "3.11"
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyright>=1.1",
]
