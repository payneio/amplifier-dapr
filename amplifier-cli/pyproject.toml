[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplifier-cli"
version = "0.1.0"
description = "CLI client for the Amplifier IPC service"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "click>=8.1.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.52",
    "pyyaml>=6.0",
]

[project.scripts]
amplifier-svc = "amplifier_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
pythonVersion = "3.12"
extraPaths = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.28",
]
